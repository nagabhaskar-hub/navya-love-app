<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Navya ❤️</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(to right,#ff758c,#ff7eb3);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
color:red;
animation:float 5s linear infinite;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}

/* MAIN BOX */

.container{
text-align:center;
background:white;
padding:40px;
border-radius:25px;
width:380px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
z-index:2;
}

h1{
color:#ff4d6d;
font-size:50px;
}

p{
color:#444;
font-size:24px;
line-height:1.8;
}

button{
padding:14px 30px;
border:none;
border-radius:40px;
margin:15px;
font-size:22px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

.yes{
background:#ff4d6d;
color:white;
}

.no{
background:#444;
color:white;
}

#result{
margin-top:20px;
font-size:24px;
color:#ff4d6d;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Navya ❤️</h1>

<p>

Krish loves you endlessly 💖<br><br>

Every moment with you feels special ✨<br><br>

Will you accept my love...? ❤️

</p>

<button class="yes" onclick="yesLove()">
Yes ❤️
</button>

<button class="no" onclick="noLove()">
No 💔
</button>

<div id="result"></div>

</div>

<script>

/* YES BUTTON */

function yesLove(){

const yesWindow=window.open("","_blank");

yesWindow.document.write(`

<html>

<head>

<title>Forever Love ❤️</title>

<style>

body{
margin:0;
padding:40px;
background:linear-gradient(135deg,#1a001a,#660033,#99004d);
font-family:'Segoe UI',sans-serif;
color:white;
line-height:2;
font-size:30px;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
background:rgba(255,255,255,0.08);
border-radius:30px;
box-shadow:0 0 30px pink;
}

h1{
text-align:center;
font-size:70px;
color:#ff99cc;
}

</style>

</head>

<body>

<div class="container">

<h1>Navya ❤️</h1>

నా జీవితంలోకి వచ్చిన  
అత్యంత అందమైన feeling నువ్వే ❤️<br><br>

నిన్ను చూసిన ప్రతిసారి  
నా heart కొత్తగా beat అవుతుంది 💖<br><br>

నీ smile చూస్తే  
నా ప్రపంచం మొత్తం beautiful గా మారిపోతుంది ✨<br><br>

నువ్వు నా life లోకి వచ్చిన తర్వాత  
ప్రతి రోజు special అయింది 🌸<br><br>

నాకు life లో పెద్ద dreams ఏమీ లేవు...  
కానీ నీతో కలిసి life మొత్తం ఉండాలని ఒక్క కోరిక ఉంది 💍❤️<br><br>

నీ బాధలో నీ shadowలా...  
నీ happiness లో నీ smileలా ఉండాలని ఉంది 💞<br><br>

ప్రతి జన్మలో కూడా  
నా heart నిన్నే ప్రేమిస్తుంది Navya ❤️<br><br>

Thank You So Much For Accepting My Love 🥹💖<br><br>

I Love You Forever Navya ❤️

</div>

</body>

</html>

`);

}

/* NO BUTTON */

function noLove(){

const noWindow=window.open("","_blank");

noWindow.document.write(`

<body>

ఎందుకంటే నిన్ను ప్రేమించడం  
నా అలవాటు కాదు...  
నా ప్రాణం 💔<br><br>

నిన్ను చూసిన రోజు నుంచి

`);

/* FLOATING HEARTS */

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
